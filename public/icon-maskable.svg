<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad-mask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730A3" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="sheet-grad-mask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="accent-grad-mask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background for Android maskable safe zone -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg-grad-mask)" />

  <!-- Centered content scaled inside 76% safe zone -->
  <g transform="translate(62 62) scale(0.758)">
    <!-- Back Sheet 1 (PPTX Orange Accent) -->
    <rect x="108" y="106" width="224" height="278" rx="26" fill="#F97316" fill-opacity="0.92" transform="rotate(-8 220 245)" />

    <!-- Back Sheet 2 (HWP Sky Accent) -->
    <rect x="172" y="102" width="224" height="278" rx="26" fill="#38BDF8" fill-opacity="0.94" transform="rotate(6 284 241)" />

    <!-- Main Foreground Document Sheet -->
    <path
      d="M142 108 H292 L366 182 V382 C366 398.569 352.569 412 336 412 H142 C125.431 412 112 398.569 112 382 V138 C112 121.431 125.431 108 142 108 Z"
      fill="url(#sheet-grad-mask)"
    />

    <!-- Folded Corner -->
    <path
      d="M292 108 V164 C292 173.941 300.059 182 310 182 H366 L292 108 Z"
      fill="#CBD5E1"
    />

    <!-- Document Content Lines -->
    <rect x="148" y="164" width="112" height="20" rx="10" fill="#4F46E5" />
    <rect x="148" y="206" width="180" height="14" rx="7" fill="#94A3B8" />
    <rect x="148" y="236" width="154" height="14" rx="7" fill="#CBD5E1" />
    <rect x="148" y="266" width="128" height="14" rx="7" fill="#CBD5E1" />

    <!-- Lossless Merge Layers Accent Bars -->
    <rect x="148" y="310" width="124" height="24" rx="12" fill="#E0E7FF" />
    <rect x="148" y="346" width="96" height="24" rx="12" fill="#E0F2FE" />

    <!-- Lossless Verification Badge -->
    <circle cx="348" cy="356" r="64" fill="#FFFFFF" />
    <circle cx="348" cy="356" r="54" fill="url(#accent-grad-mask)" />
    <path
      d="M324 356 L341 373 L374 338"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
